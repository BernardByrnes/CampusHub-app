name: CampusHub CI

on:
  push:
    branches:
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  campushub-quality:
    name: campushub-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: postgresql://campushub_ci:campushub_ci@127.0.0.1:5432/campushub_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and governance tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Drizzle schema check
        run: npm run db:check
