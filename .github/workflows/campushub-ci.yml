name: CampusHub CI

on:
  push:
    branches:
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  campushub-quality:
    name: campushub-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campushub_ci
          POSTGRES_PASSWORD: campushub_ci
          POSTGRES_DB: campushub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campushub_ci -d campushub_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://campushub_ci:campushub_ci@127.0.0.1:5432/campushub_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate PostgreSQL
        run: npm run db:migrate

      - name: PostgreSQL capability, Sports, and Fixture structure evidence
        env:
          CAMPUSHUB_DB_INTEGRATION: '1'
        run: |
          echo "capability-authority-race.test.ts PostgreSQL evidence: SHA=$(git rev-parse HEAD) CAMPUSHUB_DB_INTEGRATION=${CAMPUSHUB_DB_INTEGRATION}"
          npm run test:integration -- tests/integration/capability-authority-race.test.ts tests/integration/sports-structure.test.ts tests/integration/fixtures-structure.test.ts

      - name: Unit and governance tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Drizzle schema check
        run: npm run db:check
